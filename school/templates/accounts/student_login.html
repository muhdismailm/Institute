
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #c2410c;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #c2410c;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #ea580c;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Student Login</h2>
        <p>Login to access your student dashboard.</p>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username"
                   placeholder="Student Username" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="back">
            <a href="{% url 'home' %}">Back to Home</a>
        </div>

    </div>

</body>
</html>
